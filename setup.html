<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17764a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NutriTracker" />
    <title>NutriTracker Password Setup</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/nutritracker-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/nutritracker-icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <div class="brand-intro">
          <p class="eyebrow">First-time setup</p>
          <h1>Create password</h1>
          <p class="brand-copy" id="setupSummary">Validating your setup link...</p>
          <p class="estimate-note">After this step, use the login page to access your dashboard.</p>
        </div>
      </section>

      <section class="admin-grid">
        <form class="form-panel auth-panel" id="setupForm" hidden>
          <div class="section-head compact">
            <div>
              <h2>Password</h2>
              <p>Use at least 8 characters with uppercase, lowercase, number, and symbol.</p>
            </div>
          </div>
          <label>
            Password
            <input id="password" type="password" required autocomplete="new-password" minlength="8" />
          </label>
          <label>
            Confirm password
            <input id="confirmPassword" type="password" required autocomplete="new-password" minlength="8" />
          </label>
          <div class="save-row">
            <button class="primary" type="submit">Set password</button>
            <span id="setupMessage"></span>
          </div>
        </form>
      </section>
    </main>

    <script src="pwa.js"></script>
    <script src="setup.js"></script>
  </body>
</html>
